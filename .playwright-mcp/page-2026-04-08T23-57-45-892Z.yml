              - paragraph [ref=e172]: DISCOVER OUR NEWEST LOCATION
              - paragraph [ref=e173]: Tucked away in a neighborhood filled with historical landmarks and world-renowned museums, this AIRE oasis is nestled in a 120-year-old historic building that once served as an art and silver collections warehouse for the Museum of Modern Art (MoMA). With over 10,000 square feet of curated space, this exclusive sanctuary of relaxation offers an intimate and elevated experience designed for true disconnection. Vaulted ceilings and loft-style architecture create a serene backdrop for its signature suspended Flotarium, a saltwater bath that appears to float mid-air. Ideal for those seeking a quiet and artful retreat in the heart of the Upper East Side.
