                - text: ®
              - paragraph [ref=e130]: ENJOY A RENEWED SPACE
              - paragraph [ref=e131]: Set inside a restored 1883 textile factory, AIRE resides in Manhattan’s most cinematic and cobblestone-clad quarters and stands as one of our largest locations with 16,000 square feet of candlelit calm. Original brick, beams, and iron columns frame our thermal baths, which now feature a unique Tepidarium with a skylight where the sky itself becomes part of the experience, warm marble beds, and new massage rooms. As the first AIRE destination outside Europe, it blends historical architectural charm with the ritual of water to create a richly immersive, sensorial experience. Perfect for those seeking tranquility, more space and an iconic downtown setting.
